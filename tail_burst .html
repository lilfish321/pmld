 {tag:"平静",name:"华升股份",code:"600156",board:"首板·纺织制造",tail:"x4.6",detail:"尾盘峰x4.6(<8)·无方向"},
 {tag:"平静",name:"美晨科技",code:"300237",board:"首板20cm·汽车零部",tail:"x0.6",detail:"尾盘峰x0.6(<8)·无方向"},

var TAG_CLS={"尾盘抢筹":"t-seize","尾盘砸盘":"t-crash","地天修复":"t-fix","尾盘偷袭板":"t-sneak","尾盘异动":"t-move","平静":"t-calm"};
var TAG_ORDER={"尾盘抢筹":1,"尾盘砸盘":2,"地天修复":3,"尾盘偷袭板":4,"尾盘异动":5,"平静":9};

function $(id){return document.getElementById(id)}
function log(s){var l=$('log');l.innerHTML=s+'<br>'+l.innerHTML}
function toggleReal(){var p=$('realPanel');p.style.display=p.style.display==='none'?'block':'none'}

function render(rows){
  rows.sort(function(a,b){return (TAG_ORDER[a.tag]||9)-(TAG_ORDER[b.tag]||9)});
  var tb=$('tbl').getElementsByTagName('tbody')[0];tb.innerHTML='';
  var cnt={};
  for(var i=0;i<rows.length;i++){
    var r=rows[i];cnt[r.tag]=(cnt[r.tag]||0)+1;
    var tr=document.createElement('tr');
    tr.innerHTML='<td><span class="'+(TAG_CLS[r.tag]||'t-calm')+'">'+r.tag+'</span></td>'
      +'<td>'+r.name+'</td><td class="dim">'+r.code+'</td><td class="dim">'+(r.board||'-')+'</td>'
      +'<td>'+(r.tail||'-')+'</td><td'+(r.tag==='尾盘砸盘'?' class="warn"':(r.tag==='尾盘抢筹'||r.tag==='地天修复'?' class="good"':' class="dim"'))+'>'+(r.detail||r.err||'')+'</td>';
    tb.appendChild(tr);
  }
  $('tbl').style.display='table';
  var s=[];
  for(var k in cnt){ if(k!=='平静') s.push('<span class="'+TAG_CLS[k]+'">'+k+'×'+cnt[k]+'</span>'); }
  s.push('<span class="dim">平静×'+(cnt['平静']||0)+'</span>·共'+rows.length+'只');
  $('stat').innerHTML=s.join(' ');
}

function runBuiltin(){render(BUILTIN);log('✅ 内置回测(11.6)渲染完成·32只·与主脑手工分析3/3一致')}

// ===== 实时扫描(XHR·腾讯ifzq CORS全开) =====
function xGet(url,cb,fail){
  var x=new XMLHttpRequest();
  x.open('GET',url,true);
  x.timeout=12000;
  x.onreadystatechange=function(){ if(x.readyState===4){ if(x.status===200){try{cb(JSON.parse(x.responseText))}catch(e){fail('parse:'+e.message)}} else fail('http:'+x.status); } };
  x.ontimeout=function(){fail('timeout')};
  x.onerror=function(){fail('net')};
  x.send();
}
function full(code){return (code.charAt(0)==='6'||code.charAt(0)==='9')?'sh'+code:((code.charAt(0)==='4'||code.charAt(0)==='8')?'bj'+code:'sz'+code)}

function limitOf(code,yest){
  var r=(code.indexOf('30')===0||code.indexOf('68')===0)?1.2:(code.charAt(0)==='8'||code.charAt(0)==='4')?1.3:1.1;
  return Math.round(yest*r*100)/100;
}
function detect(rows,code,name,board,yest){
  var prev=0,mins=[];
  for(var i=0;i<rows.length;i++){
    var p=rows[i].split(' ');
    if(p.length>=3){mins.push([p[0],parseFloat(p[1]),parseFloat(p[2])-prev]);prev=parseFloat(p[2]);}
  }
  if(!mins.length)return {tag:'ERR',name:name,code:code,detail:'无分时',board:board};
  var sum=0;for(var j=0;j<mins.length;j++)sum+=mins[j][2];
  var avg=sum/mins.length;
  var close=mins[mins.length-1][1];
  var limPx=yest?limitOf(code,yest):null;
  var sealed=limPx?(close>=limPx-0.005):(close>=dayMax*0.999);
  var tail=[],dayMax=mins[0][1],dayMin=mins[0][1];
  for(var k=0;k<mins.length;k++){
    if(mins[k][0]>='1430')tail.push(mins[k]);
    if(mins[k][1]>dayMax)dayMax=mins[k][1];
    if(mins[k][1]<dayMin)dayMin=mins[k][1];
  }
  var openPx=mins[0][1];
  var deepwater=(dayMin-openPx)/openPx<-0.05;
  var tailMax=0;for(var m=0;m<tail.length;m++){var mm=tail[m][2]/avg;if(tail[m][0]==='1500'&&!sealed)continue;if(mm>tailMax)tailMax=mm;}
  var bursts=[];for(var n=0;n<tail.length;n++){if(tail[n][2]>avg*8){if(tail[n][0]==='1500'&&!sealed)continue;bursts.push(tail[n]);}}
  function r1(x){return Math.round(x*10)/10}
  if(bursts.length){
    var lb=bursts[bursts.length-1];
    if(sealed&&limPx&&dayMax<=limPx+0.005){
      var firstZt=null;for(var q=0;q<mins.length;q++){if(mins[q][1]>=close*0.999){firstZt=mins[q][0];break;}}
      if(deepwater)return {tag:'地天修复',name:name,code:code,board:board,tail:'x'+r1(tailMax),detail:'深水'+r1((dayMin-openPx)/openPx*100)+'%→最后爆量x'+r1(lb[2]/avg)+'@'+lb[1]+'→回封'+close};
      if(firstZt&&firstZt>='1450')return {tag:'尾盘偷袭板',name:name,code:code,board:board,tail:'x'+r1(tailMax),detail:firstZt+'首次封死·x'+r1(lb[2]/avg)+'·千金定律观察'};
      return {tag:'尾盘抢筹',name:name,code:code,board:board,tail:'x'+r1(tailMax),detail:'窗口'+bursts.length+'次爆量·最后x'+r1(lb[2]/avg)+'@'+lb[1]+'封死'+close+'·次日承接预期+'};
    }else{
      var idx=0;for(var w=0;w<mins.length;w++){if(mins[w][0]===lb[0]){idx=w;break;}}
      var drift=(close-lb[1])/lb[1]*100;
      if(drift<-1.5)return {tag:'尾盘砸盘',name:name,code:code,board:board,tail:'x'+r1(tailMax),detail:'最后爆量x'+r1(lb[2]/avg)+'@'+lb[1]+'→收盘'+close+'('+r1(drift)+'%)·次日大低开预警'};
      return {tag:'尾盘异动',name:name,code:code,board:board,tail:'x'+r1(tailMax),detail:'爆量x'+r1(lb[2]/avg)+'@'+lb[1]+'→收盘'+close+'('+r1(drift)+'%)·向上未封死'};
    }
  }
  return {tag:'平静',name:name,code:code,board:board,tail:'x'+r1(tailMax),detail:'尾盘峰x'+r1(tailMax)+'(<8)·无方向'};
}

function runPool(){
  var raw=$('poolInput').value.trim();
  if(!raw){log('⚠️ 先粘贴池子');return}
  var arr;
  try{
    var j=JSON.parse(raw);
    if(Array.isArray(j)){
      arr=[];
      for(var i=0;i<j.length;i++){
        if(typeof j[i]==='string')arr.push({code:j[i],name:j[i]});
        else if(j[i]&&j[i].code)arr.push({code:String(j[i].code),name:j[i].name||j[i].code,board:j[i].board||j[i].reason||''});
      }
    }else if(j.orders){for(var k=0;k<j.orders.length;k++)arr.push({code:j.orders[k].code,name:j.orders[k].name,board:''});}
    else arr=[];
  }catch(e){log('⚠️ JSON解析失败:'+e.message);return}
  if(!arr.length){log('⚠️ 未识别出代码');return}
  log('▶ 开始扫描·'+arr.length+'只…');
  var out=[],idx=0;
  function next(){
    if(idx>=arr.length){render(out);log('✅ 扫描完成·'+arr.length+'只');return}
    var s=arr[idx];
    var fc=full(s.code);
    xGet('https://ifzq.gtimg.cn/appstock/app/minute/query?code='+fc,function(d){
      try{
        var node=d.data[fc];
        var rows=node.data.data;
        var q=node.qt&&node.qt[fc];
        var nm=(q&&q[1])||s.name||s.code;      /* ①名称: minute自带qt字段 */
        var yest=(q&&+q[4])||null;              /* ②昨收: qt[4]·连fqkline都省了 */
        out.push(detect(rows,s.code,nm,s.board,yest));
      }catch(e){out.push({tag:'ERR',name:s.name,code:s.code,detail:'结构:'+e.message})}
      idx++;setTimeout(next,350);
    },function(err){
      out.push({tag:'ERR',name:s.name,code:s.code,detail:err});
      idx++;setTimeout(next,350);
    });
  }
  next();
}
